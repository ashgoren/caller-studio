<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A tool for contra callers to organize dances & programs.">
    <meta property="og:title" content="Caller Studio">
    <meta property="og:description" content="A tool for contra callers to organize dances & programs.">
    <!-- <meta property="og:image" content="/favicon/og-image.png"> -->

    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">

    <title>Caller Studio</title>
  </head>
  <body>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('mui-mode') || 'system';
          var dark = localStorage.getItem('mui-color-scheme-dark') || 'dark';
          var light = localStorage.getItem('mui-color-scheme-light') || 'light';
          var colorScheme = '';
          if (mode === 'system') {
            colorScheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? dark : light;
          } else if (mode === 'light') {
            colorScheme = light;
          } else if (mode === 'dark') {
            colorScheme = dark;
          }
          if (colorScheme) {
            document.documentElement.setAttribute('data-mui-color-scheme', colorScheme);
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
